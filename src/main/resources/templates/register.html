<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – Nova AI Chatbot</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

<div class="auth-bg"><div class="auth-particles"></div></div>

<div class="auth-wrapper auth-wrapper-wide">
    <!-- Brand Panel -->
    <div class="auth-brand">
        <div class="brand-logo">🤖</div>
        <h1 class="brand-name">Nova AI</h1>
        <p class="brand-tagline">Join thousands of users experiencing next-gen AI chat</p>
        <div class="brand-features">
            <div class="brand-feature">🆓 Completely Free</div>
            <div class="brand-feature">💬 Unlimited Chats</div>
            <div class="brand-feature">🧠 Smart AI Responses</div>
        </div>
    </div>

    <!-- Register Card -->
    <div class="auth-card auth-card-wide">
        <div class="auth-card-header">
            <h2>Create Account</h2>
            <p>Start chatting with AI in seconds</p>
        </div>

        <div th:if="${error}" class="alert alert-error">
            <span class="alert-icon">⚠️</span>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" method="post" th:object="${registerRequest}"
              class="auth-form" id="registerForm" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-row">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="name" th:field="*{name}"
                               placeholder="John Doe" class="form-input"
                               th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''">
                    </div>
                    <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📧</span>
                        <input type="email" id="email" th:field="*{email}"
                               placeholder="john@example.com" class="form-input"
                               th:classappend="${#fields.hasErrors('email')} ? ' is-invalid' : ''">
                    </div>
                    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📱</span>
                        <input type="tel" id="mobile" th:field="*{mobile}"
                               placeholder="10-digit number" class="form-input" maxlength="10"
                               th:classappend="${#fields.hasErrors('mobile')} ? ' is-invalid' : ''">
                    </div>
                    <span class="field-error" th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}"></span>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🧬</span>
                        <select id="gender" th:field="*{gender}" class="form-input form-select"
                                th:classappend="${#fields.hasErrors('gender')} ? ' is-invalid' : ''">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                            <option value="Prefer not to say">Prefer not to say</option>
                        </select>
                    </div>
                    <span class="field-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔑</span>
                        <input type="password" id="password" th:field="*{password}"
                               placeholder="Min. 6 characters" class="form-input"
                               th:classappend="${#fields.hasErrors('password')} ? ' is-invalid' : ''">
                        <button type="button" class="toggle-pwd" onclick="togglePassword('password')">👁️</button>
                    </div>
                    <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                               placeholder="Repeat password" class="form-input"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? ' is-invalid' : ''">
                        <button type="button" class="toggle-pwd" onclick="togglePassword('confirmPassword')">👁️</button>
                    </div>
                    <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                </div>
            </div>

            <!-- Password strength indicator -->
            <div class="password-strength" id="strengthBar" style="display:none">
                <div class="strength-label">Password strength: <span id="strengthText"></span></div>
                <div class="strength-track"><div class="strength-fill" id="strengthFill"></div></div>
            </div>

            <div class="terms-row">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the <a href="#" class="auth-link">Terms of Service</a> and <a href="#" class="auth-link">Privacy Policy</a></label>
            </div>

            <button type="submit" class="btn-primary btn-full" id="registerBtn">
                <span>Create My Account</span>
                <span class="btn-arrow">→</span>
            </button>
        </form>

        <div class="auth-footer">
            Already have an account?
            <a th:href="@{/login}" class="auth-link">Sign in →</a>
        </div>
    </div>
</div>

<script th:src="@{/js/auth.js}"></script>
</body>
</html>
